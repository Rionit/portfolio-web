<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renders | Filip Doležal</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="card">
      <header>
        <h1 class="hero-title">Renders</h1>
        <div class="hero-divider"></div>
      </header>

      <section class="renders-gallery">
      </section>

      <footer>
        <p><a href="home.html">← Back to Home</a></p>
        <p>© 2026 Filip Doležal</p>
      </footer>
    </div>
  </main>

  <script>
    fetch('renders.json')
      .then(response => response.json())
      .then(images => {
        const gallery = document.querySelector('.renders-gallery');
        gallery.innerHTML = ''; // Clear existing content
        
        images.forEach(item => {
          // High-res image opens when clicked
          const link = document.createElement('a');
          link.href = `renders/${item.file}`;
          link.target = '_blank';

          // Compressed thumbnail loads fast on the page
          const img = document.createElement('img');
          img.src = `renders/${item.thumb}`; 
          img.alt = item.title;
          img.loading = 'lazy'; // Performance boost

          link.appendChild(img);
          gallery.appendChild(link);
        });
      })
      .catch(error => console.error('Error loading renders:', error));
  </script>
</body>
</html>
